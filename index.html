<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY APP - UTS MOBILE 1</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 28px;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #f5f5f5;
    }
    .phone {
      width: 300px;
      min-height: 580px;
      border: 2px solid #222;
      background: white;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .login-title {
      text-align: center;
      line-height: 1.6;
      font-size: 17px;
      margin-bottom: 42px;
    }
    .login-form { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 11px; }
    .login-form input {
      width: 100%;
      height: 38px;
      border: 2px solid #222;
      padding: 8px 10px;
      font: inherit;
      text-align: center;
      outline: none;
    }
    button {
      border: 2px solid #222;
      background: #fff;
      color: #111;
      padding: 9px 14px;
      font: inherit;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    button:hover { background: #222; color: white; }
    .login-button { margin-top: 5px; font-size: 12px; min-width: 115px; }
    .message { min-height: 18px; margin: 10px 0 0; color: #b00020; font-size: 12px; text-align: center; }
    .home-title { font-size: 17px; margin: 0 0 18px; font-weight: normal; }
    .profile-card {
      border: 2px solid #222;
      width: 100%;
      min-height: 124px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .avatar {
      width: 65px;
      height: 65px;
      border: 2px solid #222;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 11px;
      line-height: 1.5;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-name { font-size: 9px; text-transform: uppercase; }
    .menu-grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .menu-grid button { min-height: 44px; padding: 8px 3px; font-size: 12px; }
    .logout { margin-top: 33px; font-size: 12px; }
    .hidden { display: none; }
    .menu-info { min-height: 16px; margin: 10px 0 0; text-align: center; font-size: 11px; }
    @media (max-width: 700px) {
      body { flex-direction: column; gap: 24px; }
      .phone { width: min(100%, 340px); min-height: 580px; }
    }
  </style>
</head>
<body>
  <!-- HALAMAN LOGIN -->
  <section class="phone" id="loginPage">
    <div class="login-title">MY APP<br>UTS MOBILE 1</div>
    <form class="login-form" id="loginForm">
      <input id="email" type="email" placeholder="INPUT EMAIL" aria-label="Email" required>
      <input id="password" type="password" placeholder="INPUT PASSWORD" aria-label="Password" required>
      <button class="login-button" type="submit">TOMBOL LOGIN</button>
    </form>
    <p class="message" id="loginMessage"></p>
  </section>

  <!-- HALAMAN HOME -->
  <section class="phone hidden" id="homePage">
    <h1 class="home-title">HOME PAGE</h1>
    <div class="profile-card">
      <div class="avatar" id="avatar">FOTO<br>PROFIL</div>
      <div class="profile-name" id="profileName">NAMA KAMU</div>
    </div>
    <div class="menu-grid">
      <button type="button" data-menu="Menu 1">MENU 1</button>
      <button type="button" data-menu="Menu 2">MENU 2</button>
      <button type="button" data-menu="Menu 3">MENU 3</button>
      <button type="button" data-menu="Menu 4">MENU 4</button>
    </div>
    <p class="menu-info" id="menuInfo"></p>
    <button class="logout" id="logoutButton" type="button">TOMBOL LOGOUT</button>
  </section>

  <script>
    const loginForm = document.getElementById("loginForm");
    const loginPage = document.getElementById("loginPage");
    const homePage = document.getElementById("homePage");
    const loginMessage = document.getElementById("loginMessage");
    const profileName = document.getElementById("profileName");
    const menuInfo = document.getElementById("menuInfo");

    loginForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (email === "" || password === "") {
        loginMessage.textContent = "Email dan password wajib diisi.";
        return;
      }

      // Demo login: data belum diperiksa ke database.
      profileName.textContent = email.split("@")[0].replace(/[._-]/g, " ");
      loginPage.classList.add("hidden");
      homePage.classList.remove("hidden");
      loginMessage.textContent = "";
    });

    document.querySelectorAll("[data-menu]").forEach(function(button) {
      button.addEventListener("click", function() {
        menuInfo.textContent = button.dataset.menu + " dipilih.";
      });
    });

    document.getElementById("logoutButton").addEventListener("click", function() {
      homePage.classList.add("hidden");
      loginPage.classList.remove("hidden");
      loginForm.reset();
      menuInfo.textContent = "";
      document.getElementById("email").focus();
    });
  </script>
</body>
</html>
